version: '3'

tasks:
  build:
    desc: Build the copilot-infra binary
    deps: [build-ui]
    cmds:
      - go build -o bin/copilot-infra cmd/copilot-infra/main.go

  build-ui:
    desc: Build the React frontend
    dir: frontend
    cmds:
      - npm install --registry=https://registry.npm.taobao.org
      - npm run build

  dev:
    desc: Run frontend and backend in development mode
    deps: [proto]
    parallel: true
    cmds:
      - task: dev-backend
      - task: dev-frontend

  dev-backend:
    internal: true
    cmds:
      - go run cmd/copilot-infra/main.go

  dev-frontend:
    internal: true
    dir: frontend
    cmds:
      - npm run dev

  start:
    desc: Start copilot-infra in background
    deps: [build]
    cmds:
      - ./bin/copilot-infra start

  stop:
    desc: Stop background copilot-infra
    cmds:
      - ./bin/copilot-infra stop

  restart:
    desc: Restart background copilot-infra
    deps: [build]
    cmds:
      - ./bin/copilot-infra restart

  status:
    desc: Check background copilot-infra status
    cmds:
      - ./bin/copilot-infra status

  test:
    desc: Run tests
    cmds:
      - go test ./...

  proto:
    desc: Generate Go code from proto files
    cmds:
      - buf generate

  mcp:
    desc: Run the application in MCP mode (stdio)
    cmds:
      - go run cmd/copilot-infra/main.go -mcp

  run-grpc:
    desc: Run the application with gRPC and HTTP transcoding
    cmds:
      - go run cmd/copilot-infra/main.go -grpc-port 50051 -dapr-http-port 3580

  # --- Infrastructure Persistence Example ---
  deploy-persistent-nginx:
    desc: Deploy Nginx with persistence (managed by Pulumi via copilot-infra)
    vars:
      PROJECT: nginx-service
      STACK: dev
    cmds:
      # This looks like a regular command, but when copilot-infra runs it,
      # it can detect the 'pulumi' intent or use a special task type.
      - pulumi up --stack {{.STACK}} --yes

  # Sample task to be executed by copilot-infra
  sample:
    desc: A sample task for testing
    cmds:
      - echo "Starting sample task..."
      - sleep 5
      - echo "Sample task completed."
